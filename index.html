<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackity 2026</title>
  <style>
    :root {
      --ink: #1a1f1c;
      --mist: #e8efe9;
      --accent: #2d6a4f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 20% 20%, #c8ddd0 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #a8c5b5 0%, transparent 45%),
        linear-gradient(160deg, #f2f7f3 0%, #d4e4da 100%);
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      animation: fade-up 0.8s ease-out both;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <h1>test only</h1>
</body>
</html>
