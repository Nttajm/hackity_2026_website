<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackity 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,700;9..40,800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --yellow: #f5e000;
      --yellow-deep: #e6c200;
      --ink: #0a0a0a;
      --intro-hold: 1.65s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--yellow);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ——— main site ——— */
    .site {
      position: relative;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background:
        radial-gradient(ellipse 90% 70% at 50% 40%, #fff36a 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 80% 90%, #ffd000 0%, transparent 50%),
        linear-gradient(165deg, var(--yellow) 0%, var(--yellow-deep) 100%);
      padding: 1.25rem clamp(1.1rem, 3vw, 2rem);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .brand-logo {
      position: relative;
      display: block;
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 50%;
      overflow: hidden;
      animation: spin-slow 14s linear infinite;
    }

    .ai-tip {
      position: absolute;
      left: calc(100% + 0.65rem);
      top: 50%;
      translate: 0 -50%;
      z-index: 20;
      max-width: 13.5rem;
      padding: 0.55rem 0.75rem;
      border-radius: 0.65rem;
      background: var(--ink);
      color: var(--yellow);
      font-size: 0.78rem;
      font-weight: 800;
      line-height: 1.3;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      opacity: 0;
      visibility: hidden;
      scale: 0.94;
      transition:
        opacity 0.28s ease,
        visibility 0.28s ease,
        scale 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .ai-tip::before {
      content: "";
      position: absolute;
      right: 100%;
      top: 50%;
      translate: 0 -50%;
      border: 7px solid transparent;
      border-right-color: var(--ink);
    }

    .ai-tip.is-visible {
      opacity: 1;
      visibility: visible;
      scale: 1;
    }

    @media (max-width: 480px) {
      .ai-tip {
        left: 0;
        top: calc(100% + 0.5rem);
        translate: 0 0;
        max-width: 11.5rem;
      }

      .ai-tip::before {
        right: auto;
        left: 0.85rem;
        top: 0;
        translate: 0 -100%;
        border: 7px solid transparent;
        border-bottom-color: var(--ink);
      }
    }

    .brand-logo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-logo .open {
      animation: brand-blink-open 5.5s steps(1, end) infinite;
    }

    .brand-logo .shut {
      opacity: 0;
      animation: brand-blink-shut 5.5s steps(1, end) infinite;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.35rem 1.35rem;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--ink);
    }

    .nav a {
      transition: opacity 0.2s ease;
    }

    .nav a:hover {
      opacity: 0.65;
    }

    .hero {
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      justify-items: center;
      align-items: center;
      width: 100%;
      text-align: center;
      min-height: 0;
    }

    .hero-core {
      grid-row: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .title-wrap {
      position: relative;
      display: inline-block;
    }

    .props-row {
      position: absolute;
      left: 50%;
      bottom: calc(100% + clamp(0.5rem, 2vw, 1rem));
      translate: -50% 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: min(92vw, 36rem);
      padding: 0 0.25rem;
      pointer-events: none;
    }

    .hero h1 {
      font-size: clamp(2.8rem, 12vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 0.95;
      text-transform: lowercase;
      color: var(--ink);
    }

    .orbit {
      flex-shrink: 0;
      width: clamp(6.5rem, 22vw, 10.5rem);
      height: clamp(6.5rem, 22vw, 10.5rem);
      pointer-events: none;
      transform-origin: center center;
      animation: rock-step 0.55s linear infinite alternate;
    }

    .orbit img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      mix-blend-mode: lighten;
    }

    .orbit-brawl {
      animation-delay: 0.22s;
    }

    .register {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1.6rem;
      border: 2px solid var(--ink);
      border-radius: 0.55rem;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .register:hover {
      background: var(--ink);
      color: var(--yellow);
    }

    .foot {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .discord {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--ink);
      font-size: 0.95rem;
      font-weight: 800;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .discord:hover {
      opacity: 1;
    }

    .discord svg {
      width: 1.35rem;
      height: 1.35rem;
      fill: currentColor;
    }

    /* ——— splash cover ——— */
    .cover {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 70% at 50% 40%, #fff36a 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 80% 90%, #ffd000 0%, transparent 50%),
        linear-gradient(165deg, var(--yellow) 0%, var(--yellow-deep) 100%);
      animation: cover-out 0.55s cubic-bezier(0.4, 0, 0.2, 1) var(--intro-hold) forwards;
    }

    .mark {
      display: flex;
      align-items: center;
      gap: clamp(0.7rem, 2.2vw, 1.25rem);
      animation: soft-grow var(--intro-hold) ease-out both;
    }

    .logo {
      position: relative;
      width: clamp(2.8rem, 8.5vw, 4.6rem);
      height: clamp(2.8rem, 8.5vw, 4.6rem);
      flex-shrink: 0;
      animation: logo-spin 0.72s cubic-bezier(0.45, 0.05, 0.2, 1) 0.4s both;
    }

    .logo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo .open {
      animation: blink-open 0.55s steps(1, end) 0.08s 2 both;
    }

    .logo .shut {
      opacity: 0;
      animation: blink-shut 0.55s steps(1, end) 0.08s 2 both;
    }

    .word {
      display: flex;
      font-size: clamp(2.4rem, 10vw, 5.5rem);
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1;
      text-transform: lowercase;
      color: var(--ink);
    }

    .word span {
      display: inline-block;
      animation: letter-flicker var(--dur, 2.8s) linear infinite;
      animation-delay: var(--delay, 0s);
    }

    .word span:nth-child(1) { --dur: 2.7s; --delay: 0.05s; }
    .word span:nth-child(2) { --dur: 3.1s; --delay: 0.4s; }
    .word span:nth-child(3) { --dur: 2.4s; --delay: 0.18s; }
    .word span:nth-child(4) { --dur: 3.4s; --delay: 0.7s; }
    .word span:nth-child(5) { --dur: 2.9s; --delay: 0.28s; }
    .word span:nth-child(6) { --dur: 3.2s; --delay: 0.55s; }
    .word span:nth-child(7) { --dur: 2.6s; --delay: 0.12s; }

    @keyframes soft-grow {
      from { scale: 1; }
      to { scale: 1.03; }
    }

    @keyframes logo-spin {
      from { rotate: 0deg; }
      to { rotate: 360deg; }
    }

    @keyframes spin-slow {
      from { rotate: 0deg; }
      to { rotate: 360deg; }
    }

    @keyframes rock-step {
      0%, 42% { transform: rotate(-15deg); }
      58%, 100% { transform: rotate(0deg); }
    }

    /* mostly single blinks; one double blink later in the cycle */
    @keyframes brand-blink-open {
      0%, 8% { opacity: 1; }
      10%, 14% { opacity: 0; }
      16%, 38% { opacity: 1; }
      40%, 44% { opacity: 0; }
      46%, 68% { opacity: 1; }
      70%, 73% { opacity: 0; }
      75%, 78% { opacity: 1; }
      80%, 83% { opacity: 0; }
      85%, 100% { opacity: 1; }
    }

    @keyframes brand-blink-shut {
      0%, 8% { opacity: 0; }
      10%, 14% { opacity: 1; }
      16%, 38% { opacity: 0; }
      40%, 44% { opacity: 1; }
      46%, 68% { opacity: 0; }
      70%, 73% { opacity: 1; }
      75%, 78% { opacity: 0; }
      80%, 83% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }

    @keyframes cover-out {
      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    @keyframes letter-flicker {
      0%, 100% { opacity: 1; }
      4% { opacity: 0.55; }
      5% { opacity: 1; }
      22% { opacity: 0.85; }
      23% { opacity: 1; }
      47% { opacity: 0.4; }
      48% { opacity: 1; }
      61% { opacity: 0.7; }
      62% { opacity: 1; }
      79% { opacity: 0.5; }
      80% { opacity: 1; }
    }

    @keyframes blink-open {
      0%, 12% { opacity: 1; }
      18%, 38% { opacity: 0; }
      44%, 100% { opacity: 1; }
    }

    @keyframes blink-shut {
      0%, 12% { opacity: 0; }
      18%, 38% { opacity: 1; }
      44%, 100% { opacity: 0; }
    }

    @media (max-width: 640px) {
      .nav {
        gap: 0.3rem 0.85rem;
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>
  <main class="site" aria-label="Hackity 2026">
    <header class="top">
      <div class="brand-wrap">
        <a class="brand-logo" href="#" aria-label="Hackity home">
          <img class="open" src="assets/hackity-logo.png" alt="" />
          <img class="shut" src="assets/hackity-logo-blink.png" alt="" />
        </a>
        <p class="ai-tip" id="ai-tip" role="status" aria-live="polite">
          Hey im hackity! ask me anything.
        </p>
      </div>
      <nav class="nav" aria-label="Primary">
        <a href="#about">About</a>
        <a href="#agenda">Agenda</a>
        <a href="#faqs">FAQs</a>
        <a href="#judges">Judges</a>
        <a href="#sponsors">Sponsors</a>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-core">
        <div class="title-wrap">
          <div class="props-row" aria-hidden="true">
            <span class="orbit orbit-boba">
              <img src="assets/boa.png" alt="" />
            </span>
            <span class="orbit orbit-brawl">
              <img src="assets/brawlstars.png" alt="" />
            </span>
          </div>
          <h1>hackity 2026</h1>
        </div>
        <a class="register" href="#register">Register</a>
      </div>
    </section>

    <footer class="foot">
      <a class="discord" href="https://discord.com" target="_blank" rel="noopener noreferrer" aria-label="Join Discord">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        Discord
      </a>
    </footer>
  </main>

  <div class="cover" id="cover" aria-hidden="true">
    <div class="mark" aria-label="Hackity">
      <div class="logo">
        <img class="open" src="assets/hackity-logo.png" alt="" />
        <img class="shut" src="assets/hackity-logo-blink.png" alt="" />
      </div>
      <div class="word">
        <span>h</span><span>a</span><span>c</span><span>k</span><span>i</span><span>t</span><span>y</span>
      </div>
    </div>
  </div>

  <script>
    const cover = document.getElementById("cover");
    const aiTip = document.getElementById("ai-tip");
    const tipDurationMs = 2600;

    function showAiTip() {
      if (!aiTip || aiTip.dataset.shown === "true") return;
      aiTip.dataset.shown = "true";
      aiTip.classList.add("is-visible");
      window.setTimeout(() => aiTip.classList.remove("is-visible"), tipDurationMs);
    }

    function onIntroDone() {
      window.setTimeout(showAiTip, 180);
    }

    cover.addEventListener("animationend", (event) => {
      if (event.animationName === "cover-out") {
        cover.remove();
        onIntroDone();
      }
    });
  </script>
</body>
</html>
